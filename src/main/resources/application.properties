# All secrets come from environment variables. Do not put keys in this file.
server.port=${PORT:8080}

app.nyt-api-key=${NYT_API_KEY:}
app.anthropic-api-key=${ANTHROPIC_API_KEY:}
app.claude-model=${CLAUDE_MODEL:claude-opus-5-5}

# Cache lifetimes. NYT is clamped to a 10-minute minimum in code.
app.rss-cache-minutes=${RSS_CACHE_MINUTES:10}
app.nyt-cache-minutes=${NYT_CACHE_MINUTES:15}

# Hide items older than this (some feeds stop updating but still respond).
app.max-story-age-days=${MAX_STORY_AGE_DAYS:7}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Jar entries have fixed timestamps, so Last-Modified never changes. Make browsers revalidate static files.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-cache=true
